<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contador con cámara</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin: 15px 0 5px;
    }

    #contador {
        font-size: 60px;
        font-weight: bold;
        margin: 10px;
    }

    .camara {
        position: relative;
        width: 95%;
        max-width: 600px;
        margin: auto;
        overflow: hidden;
        border-radius: 15px;
        background: black;
    }

    video {
        width: 100%;
        display: block;
        transform: scaleX(-1);
    }

    /* Línea donde se detectará el objeto */
    .linea {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 4px;
        background: red;
        box-shadow: 0 0 10px red;
    }

    button {
        margin: 10px 5px;
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        background: #2196f3;
        color: white;
    }

    #estado {
        color: #aaa;
        margin: 10px;
    }
</style>
</head>

<body>

<h1>Contador</h1>

<div id="contador">0</div>

<div class="camara">
    <video id="video" autoplay playsinline></video>
    <div class="linea"></div>
</div>

<p id="estado">Cámara apagada</p>

<button onclick="iniciar()">Iniciar cámara</button>
<button onclick="reiniciar()">Reiniciar contador</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let contador = 0;
let anterior = null;

let detectando = false;
let ultimoConteo = 0;

// Tiempo mínimo entre dos conteos
const ESPERA = 800;

// Iniciar cámara frontal
async function iniciar() {

    try {

        const stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user"
            },
            audio: false
        });

        video.srcObject = stream;

        document.getElementById("estado").textContent =
            "Cámara activa. Pasa un objeto por la línea roja.";

        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            anterior = null;

            detectar();
        };

    } catch (error) {

        console.error(error);

        document.getElementById("estado").textContent =
            "No se pudo acceder a la cámara.";
    }
}


// Detectar movimiento
function detectar() {

    if (video.readyState !== video.HAVE_ENOUGH_DATA) {
        requestAnimationFrame(detectar);
        return;
    }

    // Tomamos solamente una franja central de la imagen
    const y = Math.floor(canvas.height * 0.45);
    const alto = Math.floor(canvas.height * 0.10);

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const actual = ctx.getImageData(
        0,
        y,
        canvas.width,
        alto
    );

    if (anterior) {

        let diferencia = 0;

        // Comparar píxeles con la imagen anterior
        for (let i = 0; i < actual.data.length; i += 16) {

            const r = Math.abs(actual.data[i] - anterior.data[i]);
            const g = Math.abs(actual.data[i + 1] - anterior.data[i + 1]);
            const b = Math.abs(actual.data[i + 2] - anterior.data[i + 2]);

            if (r + g + b > 100) {
                diferencia++;
            }
        }

        // Si suficiente parte de la zona cambió
        if (
            diferencia > 300 &&
            !detectando &&
            Date.now() - ultimoConteo > ESPERA
        ) {

            contador++;

            document.getElementById("contador").textContent =
                contador;

            ultimoConteo = Date.now();
            detectando = true;

            setTimeout(() => {
                detectando = false;
            }, ESPERA);
        }
    }

    anterior = actual;

    requestAnimationFrame(detectar);
}


// Reiniciar
function reiniciar() {

    contador = 0;

    document.getElementById("contador").textContent = "0";

    anterior = null;
}

</script>

</body>
</html>
