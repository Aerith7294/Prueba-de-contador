<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contador con cámara frontal</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h1 {
        margin: 15px 0 5px;
    }

    #contador {
        font-size: 65px;
        font-weight: bold;
        margin: 5px;
    }

    .camara {
        position: relative;
        width: 95%;
        max-width: 600px;
        margin: auto;
        overflow: hidden;
        border-radius: 15px;
        background: black;
    }

    video {
        width: 100%;
        display: block;

        /* Efecto espejo de cámara selfie */
        transform: scaleX(-1);
    }

    /* Línea de detección */
    .linea {
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 5px;
        background: red;
        box-shadow: 0 0 12px red;
    }

    button {
        margin: 10px 5px;
        padding: 13px 20px;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        background: #2196f3;
        color: white;
    }

    button:active {
        transform: scale(0.96);
    }

    #estado {
        color: #aaa;
        margin: 10px;
    }

    #canvas {
        display: none;
    }
</style>
</head>

<body>

<h1>Contador</h1>

<div id="contador">0</div>

<div class="camara">

    <!-- Cámara frontal -->
    <video id="video" autoplay playsinline></video>

    <!-- Línea de detección -->
    <div class="linea"></div>

</div>

<p id="estado">Cámara apagada</p>

<button onclick="iniciar()">
    📷 Iniciar cámara
</button>

<button onclick="reiniciar()">
    🔄 Reiniciar
</button>

<canvas id="canvas"></canvas>


<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let contador = 0;
let anterior = null;

let detectando = false;
let ultimoConteo = 0;

/*
    Tiempo mínimo entre detecciones.
    Evita que un mismo objeto
    cuente muchas veces.
*/
const ESPERA = 1000;


// ========================================
// INICIAR CÁMARA FRONTAL
// ========================================

async function iniciar() {

    try {

        // Intentar detener una cámara anterior
        if (video.srcObject) {

            video.srcObject
                .getTracks()
                .forEach(track => track.stop());
        }


        /*
            "user" = cámara frontal/selfie.

            "exact" hace que el navegador
            intente obligatoriamente utilizar
            la cámara frontal.
        */

        const stream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: {
                        exact: "user"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }
                },

                audio: false
            });


        // Mostrar cámara
        video.srcObject = stream;


        document.getElementById("estado").textContent =
            "📷 Cámara frontal activa";


        // Cuando la cámara esté lista
        video.onloadedmetadata = () => {

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            anterior = null;

            detectar();
        };


    } catch (error) {

        console.error(error);

        document.getElementById("estado").textContent =
            "❌ No se pudo abrir la cámara frontal.";

        alert(
            "No se pudo acceder a la cámara frontal.\n\n" +
            "Comprueba que el navegador tenga permiso para usar la cámara."
        );
    }
}


// ========================================
// DETECCIÓN DE MOVIMIENTO
// ========================================

function detectar() {

    if (video.readyState !== video.HAVE_ENOUGH_DATA) {

        requestAnimationFrame(detectar);

        return;
    }


    /*
        Zona donde vamos a buscar movimiento.

        Aproximadamente el centro de la imagen.
    */

    const y =
        Math.floor(canvas.height * 0.45);

    const alto =
        Math.floor(canvas.height * 0.10);


    // Dibujar imagen de la cámara
    ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Obtener solamente la franja central
    const actual =
        ctx.getImageData(
            0,
            y,
            canvas.width,
            alto
        );


    // Comparar con el cuadro anterior

    if (anterior) {

        let diferencia = 0;


        /*
            Revisamos los píxeles.

            Saltamos algunos píxeles para que
            el teléfono tenga menos trabajo.
        */

        for (
            let i = 0;
            i < actual.data.length;
            i += 16
        ) {

            const r =
                Math.abs(
                    actual.data[i] -
                    anterior.data[i]
                );

            const g =
                Math.abs(
                    actual.data[i + 1] -
                    anterior.data[i + 1]
                );

            const b =
                Math.abs(
                    actual.data[i + 2] -
                    anterior.data[i + 2]
                );


            /*
                Si hay suficiente diferencia
                entre imágenes, consideramos
                que pasó algo.
            */

            if (r + g + b > 100) {

                diferencia++;
            }
        }


        // ====================================
        // CONTAR
        // ====================================

        if (
            diferencia > 300 &&
            !detectando &&
            Date.now() - ultimoConteo > ESPERA
        ) {

            contador++;


            document.getElementById(
                "contador"
            ).textContent = contador;


            ultimoConteo =
                Date.now();


            detectando = true;


            /*
                Esperamos antes de permitir
                otro conteo.
            */

            setTimeout(() => {

                detectando = false;

            }, ESPERA);
        }
    }


    // Guardar imagen actual
    anterior = actual;


    // Continuar analizando
    requestAnimationFrame(detectar);
}


// ========================================
// REINICIAR CONTADOR
// ========================================

function reiniciar() {

    contador = 0;

    document.getElementById(
        "contador"
    ).textContent = "0";

    anterior = null;

    detectando = false;

    ultimoConteo = 0;
}

</script>

</body>
</html>
