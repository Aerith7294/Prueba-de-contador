<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contador con cámara</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;text-align:center}
h1{font-size:22px;margin:14px 0 8px}
#wrap{position:relative;width:100%;max-width:720px;margin:auto;background:#000;overflow:hidden}
video,canvas{display:block;width:100%;height:auto}
canvas{position:absolute;left:0;top:0}
#count{font-size:64px;font-weight:bold;margin:8px 0}
button{border:0;border-radius:12px;padding:12px 18px;margin:5px;font-size:16px;font-weight:bold}
#start{background:#35c759;color:#fff}
#reset{background:#444;color:#fff}
#status{font-size:14px;color:#bbb;margin:8px 15px 14px}
small{display:block;color:#888;margin:0 15px 15px}
</style>
</head>
<body>
<h1>📷 Contador de objetos</h1>
<div id="count">0</div>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
</div>
<div>
  <button id="start">▶ Iniciar cámara</button>
  <button id="reset">↻ Reiniciar</button>
</div>
<div id="status">Pulsa «Iniciar cámara» y permite el acceso.</div>
<small>El contador suma cuando un objeto detectado cruza la línea central.</small>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const countEl=document.getElementById('count');
const statusEl=document.getElementById('status');
let model=null,stream=null,running=false,count=0,lastTime=0;
let tracks=[],nextId=1;

const allowed = new Set([
  'person','bicycle','car','motorcycle','bus','truck',
  'backpack','handbag','suitcase','bottle','cup','chair',
  'book','cell phone','laptop','mouse','keyboard','sports ball'
]);

function reset(){
  count=0; countEl.textContent='0'; tracks=[]; nextId=1;
}
document.getElementById('reset').onclick=reset;

function center(b){
  return {x:b[0]+b[2]/2,y:b[1]+b[3]/2};
}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function drawLine(){
  const y=canvas.height/2;
  ctx.strokeStyle='#00ff66'; ctx.lineWidth=4;
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();
  ctx.font='bold 18px Arial';ctx.fillStyle='#00ff66';
  ctx.fillText('LÍNEA DE CONTEO',12,y-10);
}

function drawBox(p, color){
  const [x,y,w,h]=p.bbox;
  ctx.strokeStyle=color;ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
  ctx.fillStyle=color;ctx.font='bold 15px Arial';
  ctx.fillText(p.class+' '+Math.round(p.score*100)+'%',x,y>20?y-5:y+17);
}

function updateTracks(preds){
  const now=Date.now();
  const detections=preds.map(p=>({p,c:center(p.bbox)}));
  const used=new Set();

  for(const d of detections){
    let best=null,bestD=Infinity;
    for(const t of tracks){
      if(used.has(t.id)) continue;
      const dd=dist(d.c,t.c);
      const maxD=Math.max(45, Math.min(canvas.width,canvas.height)*0.12);
      if(dd<bestD && dd<maxD){bestD=dd;best=t;}
    }
    if(best){
      used.add(best.id);
      const oldY=best.c.y, newY=d.c.y;
      const mid=canvas.height/2;
      // Cuenta solo cuando el centro cruza la línea.
      if((oldY<mid && newY>=mid)||(oldY>mid && newY<=mid)){
        count++; countEl.textContent=count;
        if(navigator.vibrate) navigator.vibrate(80);
      }
      best.c=d.c;best.bbox=d.p.bbox;best.class=d.p.class;best.score=d.p.score;best.last=now;
      d.p._color=best.counted ? '#ffcc00':'#00ff66';
    }else{
      tracks.push({id:nextId++,c:d.c,bbox:d.p.bbox,class:d.p.class,score:d.p.score,last:now});
      d.p._color='#00ff66';
    }
  }
  tracks=tracks.filter(t=>now-t.last<700);
}

async function loop(){
  if(!running)return;
  if(video.readyState>=2){
    const preds=await model.detect(video,20,0.55);
    const filtered=preds.filter(p=>allowed.has(p.class));
    // Dibujar en coordenadas del video/canvas.
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawLine();
    updateTracks(filtered);
    for(const p of filtered) drawBox(p,p._color||'#00ff66');
    statusEl.textContent='Detectando objetos…';
  }
  requestAnimationFrame(loop);
}

async function start(){
  if(running)return;
  try{
    statusEl.textContent='Cargando modelo de detección…';
    model=await cocoSsd.load({base:'lite_mobilenet_v2'});
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    canvas.width=video.videoWidth||640;
    canvas.height=video.videoHeight||480;
    running=true;
    statusEl.textContent='Detectando objetos…';
    loop();
  }catch(e){
    statusEl.textContent='No se pudo iniciar: '+e.message;
  }
}
document.getElementById('start').onclick=start;
</script>
</body>
</html>
